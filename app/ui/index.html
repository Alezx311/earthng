<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>EarthNG — Map Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav class="rail" aria-label="sections">
  <div class="brand" title="EarthNG"><img src="logo.png" alt="EarthNG"></div>
  <button class="rail-btn active" data-section="map" data-i18n-title="nav.map">🗺</button>
  <button class="rail-btn" data-section="projects" data-i18n-title="nav.projects">📁</button>
  <button class="rail-btn" data-section="settings" data-i18n-title="nav.settings">⚙</button>
  <div class="grow"></div>
  <button class="rail-btn small" id="lang" title="Мова / Language">УК</button>
</nav>

<main class="map-wrap">
  <div id="map"></div>
  <div class="map-tools">
    <div class="search">
      <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off">
      <ul id="search-results" hidden></ul>
    </div>
    <button id="tool-box" class="tool" data-i18n="tool.box"></button>
    <button id="tool-edit" class="tool" data-i18n="tool.edit"></button>
  </div>
  <div class="legend" id="hint" data-i18n="hint.select"></div>
</main>

<aside class="panel" id="panel">
  <!-- section: map -->
  <section data-panel="map">
    <div class="setup" id="setup">
      <div class="setup-row" id="setup-game"></div>
      <div class="setup-row" id="setup-planet"></div>
    </div>
    <div id="banner"></div>

    <div class="card" id="card-empty">
      <div class="step"><span class="num">1</span><h2 data-i18n="empty.title"></h2></div>
      <p class="muted" data-i18n="empty.body"></p>
      <button class="primary big" id="empty-draw" data-i18n="empty.draw"></button>
      <p class="muted small" data-i18n="empty.tip"></p>
      <div id="recent"></div>
    </div>

    <div class="card" id="card-area" hidden>
      <div class="row between">
        <div class="step"><span class="num">2</span><h2 id="area-title"></h2></div>
        <button class="link" id="area-clear" data-i18n="area.clear"></button>
      </div>
      <dl class="facts">
        <dt data-i18n="area.size"></dt><dd id="area-km2">—</dd>
        <dt data-i18n="area.source"></dt><dd id="area-source">—</dd>
        <dt data-i18n="area.time"></dt><dd id="area-time">—</dd>
      </dl>
      <div id="area-notes"></div>
      <button class="primary big" id="build" data-i18n="area.build"></button>

      <details class="more" id="more-look">
        <summary data-i18n="look.title"></summary>
        <label class="field"><span data-i18n="look.block"></span><select id="look-block"></select></label>
        <div id="look-slots" class="grid2"></div>
        <h3 data-i18n="layers.title"></h3>
        <div id="layers" class="toggles"></div>
      </details>

      <details class="more" id="more-project">
        <summary data-i18n="project.title"></summary>
        <label class="field"><span data-i18n="area.name"></span><input id="project-title"></label>
        <p class="muted small" id="edits-count"></p>
        <div class="actions"><button id="save-project" data-i18n="area.save"></button></div>
      </details>
    </div>

    <div class="card" id="card-pbf" hidden>
      <div class="step"><span class="num">2</span><h2 data-i18n="pbf.title"></h2></div>
      <p id="pbf-lead"></p>
      <p class="muted small" id="pbf-reason"></p>
      <dl class="facts">
        <dt data-i18n="pbf.file"></dt><dd id="pbf-file">—</dd>
        <dt data-i18n="pbf.size"></dt><dd id="pbf-size">—</dd>
        <dt data-i18n="pbf.time"></dt><dd id="pbf-time">—</dd>
      </dl>
      <p class="note info" data-i18n="pbf.kept"></p>
      <div class="actions column">
        <button class="primary big" id="pbf-go" data-i18n="pbf.go"></button>
        <button id="pbf-back" data-i18n="pbf.back"></button>
      </div>
    </div>

    <div class="card" id="card-build" hidden>
      <div class="row between">
        <div class="step"><span class="num">3</span><h2 id="build-title" data-i18n="build.title"></h2></div>
        <span class="muted" id="build-elapsed"></span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <ol id="stages" class="stages"></ol>
      <div id="build-error"></div>
      <details class="more" id="log-box">
        <summary data-i18n="build.log"></summary>
        <pre id="log" class="log"></pre>
      </details>
      <div class="actions">
        <button class="danger" id="stop" data-i18n="build.stop"></button>
        <button class="primary" id="build-retry" data-i18n="build.retry" hidden></button>
        <button id="build-back" data-i18n="build.back" hidden></button>
      </div>
    </div>

    <div class="card" id="card-done" hidden>
      <div class="done-mark">✓</div>
      <h2 id="done-title" data-i18n="done.title"></h2>
      <p id="done-body"></p>
      <p class="muted small path" id="done-path"></p>
      <div class="actions column">
        <button class="primary big" id="launch-game" data-i18n="done.launch"></button>
        <button id="open-mods" data-i18n="build.open"></button>
        <button class="link" id="done-another" data-i18n="done.another"></button>
      </div>
    </div>
  </section>

  <!-- section: projects -->
  <section data-panel="projects" hidden>
    <div class="card">
      <h2 data-i18n="projects.title"></h2>
      <p class="muted" data-i18n="projects.body"></p>
      <ul id="projects" class="list"></ul>
    </div>
  </section>

  <!-- section: settings -->
  <section data-panel="settings" hidden>
    <div class="card">
      <h2 data-i18n="settings.title"></h2>
      <label class="field"><span data-i18n="settings.game"></span>
        <select id="game-folders"></select></label>
      <label class="field"><span data-i18n="settings.other"></span>
        <div class="row"><input id="game-folder"><button id="game-folder-set" data-i18n="settings.apply"></button></div></label>
      <p class="muted small" id="game-folder-state"></p>
      <h3 data-i18n="settings.planet"></h3>
      <p id="planet-state" class="small"></p>
      <button id="planet-install" data-i18n="planet.install"></button>
      <h3 data-i18n="settings.data"></h3>
      <p class="muted small" id="home-path"></p>
      <button id="open-home" data-i18n="settings.openHome"></button>
      <p class="muted small" id="about"></p>
    </div>
  </section>
</aside>

<footer class="status">
  <span id="st-game"></span>
  <span id="st-planet"></span>
  <span id="st-disk"></span>
  <span class="grow"></span>
  <span id="st-task"></span>
</footer>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
