[package]
name = "osm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
hex = "0.4.3"
memmap2 = "0.9.12"
osmpbf = "0.3.8"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
smallvec = "1.16.4"
