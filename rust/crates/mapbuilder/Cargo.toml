[package]
name = "mapbuilder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "earthng-mapbuilder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
osm = { version = "0.1.0", path = "../osm" }
pack = { path = "../pack" }
cells = { path = "../cells" }
serde = { version = "1", features = ["derive"] }
rayon = "1.12.0"
serde_json = "1.0.154"
zip = { version = "2", default-features = false, features = ["deflate"] }
